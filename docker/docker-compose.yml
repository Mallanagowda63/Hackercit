version: '3.8'
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - hacknet

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env.example
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    networks:
      - hacknet

  sandbox:
    build: ../docker/sandbox
    networks:
      - hacknet

volumes:
  mongo-data:

networks:
  hacknet:
    driver: bridge
