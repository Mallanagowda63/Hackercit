# Run from the repo root: docker compose -f docker/docker-compose.yml up -d --build
# Settings come from backend/.env (MongoDB Atlas, JWT, SMTP, Judge0/RapidAPI).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
