# Nginx site for DevOrbit. Copied to /etc/nginx/sites-available/devorbit by setup.sh.
# Replace YOUR_DOMAIN with the real domain (or the VPS IP if there is no domain yet).
server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # React/Babel bundles never change between deploys of the same package versions.
    location /vendor/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Judge0 runs wait up to 45s for a result.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
